<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CampusRoom</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#0A0010;color:#F0EEFF;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
input,select,textarea{outline:none;font-family:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}
:root{
  --bg:#0A0010;--bg2:#0F0020;--surface:#180830;--card:#1E1040;
  --border:#3D1A6E;--purple:#7B00FF;--p2:#9B30FF;--p3:#B86EFF;
  --plight:#D4AAFF;--red:#CC1133;--rlight:#FF3355;
  --white:#FFFFFF;--off:#F0EEFF;--muted:#8877AA;
  --glass:rgba(123,0,255,.13);--gb:rgba(184,110,255,.28);
}
/* PAGE SYSTEM */
.page{position:fixed;inset:0;background:var(--bg);display:none;overflow-y:auto;z-index:5;}
.page.show{display:flex;flex-direction:column;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;border:none;cursor:pointer;}
.btn:active{transform:scale(.97);}
.btn-p{background:linear-gradient(135deg,var(--purple),var(--p2));color:#fff;box-shadow:0 4px 20px rgba(123,0,255,.4);}
.btn-g{background:var(--glass);color:var(--plight);border:1px solid var(--gb);}
.btn-d{background:rgba(204,17,51,.18);color:#FF6688;border:1px solid rgba(204,17,51,.3);}
.btn-w{width:100%;}
/* FIELDS */
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;color:var(--off);font-size:14px;transition:all .12s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p3);}
.field select option{background:#1E1040;}
.field textarea{resize:vertical;min-height:80px;}
.err{color:#FF6688;font-size:13px;margin-bottom:10px;padding:8px 12px;background:rgba(204,17,51,.1);border-radius:8px;border:1px solid rgba(204,17,51,.2);display:none;}
.err.show{display:block;}
.ok{color:#6EE7B7;font-size:13px;margin-bottom:10px;padding:8px 12px;background:rgba(52,211,153,.1);border-radius:8px;border:1px solid rgba(52,211,153,.2);display:none;}
.ok.show{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;}
.pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;background:rgba(123,0,255,.22);color:var(--plight);border:1px solid rgba(184,110,255,.3);}
/* LOGO */
.logo-wrap{width:80px;height:80px;border-radius:22px;margin:0 auto 18px;background:linear-gradient(145deg,#2A0060,#7B00FF,#A030FF);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(123,0,255,.12);position:relative;}
.logo-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18)0%,transparent 55%);border-radius:inherit;}
.logo-inner{position:relative;z-index:1;text-align:center;}
.logo-cr{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:24px;color:#fff;letter-spacing:-1px;line-height:1;}
.logo-sub{font-size:7px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:2.5px;text-transform:uppercase;}
.logo-dot{width:5px;height:5px;border-radius:50%;background:var(--rlight);margin:3px auto 0;box-shadow:0 0 7px var(--rlight);}
.logo-sm{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#2A0060,#7B00FF,#A030FF);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:800;color:#fff;}
/* LOADING SPINNER */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spinner{width:48px;height:48px;border:3px solid rgba(123,0,255,.2);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
/* LANDING */
#pg-land{align-items:center;justify-content:center;text-align:center;padding:32px 24px;position:relative;}
.g1{position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(123,0,255,.38)0%,transparent 68%);top:-8%;left:50%;transform:translateX(-50%);pointer-events:none;opacity:.8;}
.g2{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(204,17,51,.22)0%,transparent 65%);bottom:8%;right:-5%;pointer-events:none;}
@keyframes gp{0%,100%{opacity:.65;}50%{opacity:1;}}
.land-h{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.2rem,9vw,3.6rem);font-weight:800;line-height:1;margin-bottom:8px;letter-spacing:-1.5px;}
.land-h .gw{background:linear-gradient(135deg,#fff,#D4AAFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.land-h .gr2{color:var(--rlight);}
.land-p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:34px;max-width:320px;margin-left:auto;margin-right:auto;}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.chip{background:var(--glass);color:var(--plight);border:1px solid var(--gb);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;}
/* ...rest of CSS omitted for brevity in commit but preserved in file... */
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="logo-wrap" style="margin-bottom:20px;">
    <div class="logo-inner">
      <div class="logo-cr">CR</div>
      <div class="logo-sub">Campus</div>
      <div class="logo-dot"></div>
    </div>
  </div>
  <div class="spinner"></div>
  <p style="color:var(--muted);font-size:13px;">Loading CampusRoom…</p>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- POST COMPOSE MODAL -->
<div class="modal-overlay" id="compose-modal">
  <div class="modal-box">
    <span class="modal-close" onclick="closeCompose()">✕</span>
    <h3>Create Post</h3>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div class="fp-av" id="compose-modal-av" style="width:40px;height:40px;font-size:16px;"></div>
      <div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;" id="compose-modal-name"></div>
        <div style="font-size:12px;color:var(--muted);" id="compose-modal-role"></div>
      </div>
    </div>
    <textarea id="post-text" style="width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--off);font-size:14px;min-height:100px;resize:vertical;"></textarea>
    <div style="margin-top:10px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:13px;">
        <input type="file" id="post-img-file" accept="image/*" style="display:none" onchange="previewPostImg(this)">
        <span onclick="document.getElementById('post-img-file').click()">🖼️ Add Photo</span>
      </label>
      <img id="post-img-preview" style="display:none;width:100%;border-radius:10px;margin-top:8px;max-height:200px;object-fit:cover;">
    </div>
    <button class="btn btn-p btn-w" style="margin-top:14px;" onclick="submitPost()">Post</button>
  </div>
</div>

<!-- LANDING -->
<div id="pg-land" class="page show">
  <div class="g1"></div><div class="g2"></div>
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;">
    <div class="logo-wrap">
      <div class="logo-inner">
        <div class="logo-cr">CR</div>
        <div class="logo-sub">Campus</div>
        <div class="logo-dot"></div>
      </div>
    </div>
    <div style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:3.5px;text-transform:uppercase;margin-bottom:14px;">Nigeria's Campus Platform</div>
    <h1 class="land-h"><span class="gw">Campus</span><span class="gr2">Room</span></h1>
    <p class="land-p">Your all-in-one higher institution platform — connecting aspirants, students, lecturers and alumni across Nigeria.</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-bottom:28px;flex-wrap:wrap;">
      <button class="btn btn-p" onclick="show('pg-login')" style="padding:13px 30px;font-size:15px;">Sign In</button>
      <button class="btn btn-g" onclick="show('pg-register')" style="padding:13px 30px;font-size:15px;">Register</button>
    </div>
    <div class="chips">
      <span class="chip">🎓 Aspirant</span><span class="chip">📚 Student</span>
      <span class="chip">👨‍🏫 Lecturer</span><span class="chip">🏅 Alumni</span>
    </div>
  </div>
</div>
