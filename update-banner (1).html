<!-- Paste just before </body> in index.html.
     Delete your old navigator.serviceWorker.register(...) code first. -->

<div id="updateBanner" style="display:none;position:fixed;left:12px;right:12px;bottom:76px;z-index:99999;background:#111;color:#fff;padding:12px 14px;border-radius:14px;align-items:center;justify-content:space-between;gap:10px;font:14px system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)">
  <span>New version available</span>
  <button id="updateBtn" style="background:#fff;color:#111;border:0;border-radius:10px;padding:8px 14px;font-weight:600">Refresh</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    // Relative path so it works on both GitHub Pages and Vercel.
    const reg = await navigator.serviceWorker.register('sw.js', { scope: './' });

    const banner = document.getElementById('updateBanner');
    const btn = document.getElementById('updateBtn');

    function showBanner(worker) {
      banner.style.display = 'flex';
      btn.onclick = () => {
        btn.textContent = 'Updating...';
        worker.postMessage({ type: 'SKIP_WAITING' });
      };
    }

    // Reload once when the new worker takes over.
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });

    // An update was already downloaded and is waiting.
    if (reg.waiting && navigator.serviceWorker.controller) showBanner(reg.waiting);

    // A new update is found while the app is open.
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) showBanner(nw);
      });
    });

    // Check for updates when the app comes back to the screen, and hourly.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) reg.update();
    });
    setInterval(() => reg.update(), 60 * 60 * 1000);
  });
}
</script>
